name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-website-production
      cancel-in-progress: false

    steps:
      - name: Deploy Website to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            sudo -u digipay -H bash -lc '
              set -euo pipefail
              cd /var/www/pearl-of-the-orient
              git config --global --add safe.directory /var/www/pearl-of-the-orient
              git fetch origin main
              git reset --hard origin/main
              pnpm install --no-frozen-lockfile
              pnpm build
            '
            pm2 restart pearl-app --update-env
